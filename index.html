<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moduley Pro | Elite GPA Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f0f4f8; --card: #ffffff; --text: #1e293b; --text-sub: #64748b; --primary: #334155; --accent: #84cc16; --fail: #ef4444; --border: #e2e8f0; --input-bg: #f8fafc; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-sub: #94a3b8; --primary: #38bdf8; --border: #334155; --input-bg: #0f172a; }
        
        body, html { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; height: 100%; transition: 0.3s; }

        /* Splash & Onboarding Screens */
        .screen { position: fixed; inset: 0; background: #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; text-align: center; color: white; transition: 0.5s ease-in-out; }
        .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(-20px); }
        .logo-icon { width: 100px; height: 100px; background: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .btn-next { background: #475569; color: white; border: none; padding: 16px 40px; border-radius: 16px; font-weight: 700; cursor: pointer; margin-top: 30px; width: 80%; max-width: 300px; }
        
        /* Main Interface */
        header { width: 100%; max-width: 500px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; margin: 0 auto; }
        #app { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 15px 120px 15px; box-sizing: border-box; }
        
        .pro-card { background: var(--card); border-radius: 28px; padding: 24px; margin-bottom: 20px; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); position: relative; overflow: hidden; }
        
        /* Module Grid */
        .module-grid { display: grid; grid-template-columns: 1.5fr 0.6fr 0.8fr 0.8fr 35px; gap: 10px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        input { background: var(--input-bg); border: 1.5px solid var(--border); color: var(--text); padding: 12px; border-radius: 14px; width: 100%; box-sizing: border-box; font-size: 0.9rem; font-weight: 700; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .td-toggle { cursor: pointer; font-size: 0.65rem; font-weight: 800; padding: 5px 10px; border-radius: 10px; background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border); display: inline-block; margin-top: 6px; }
        .td-toggle.active { background: #e2e8f0; color: #334155; border-color: #334155; }

        /* Results Display (Pic Style) */
        .result-panel { text-align: center; padding: 40px 20px; background: var(--card); border-radius: 32px; border: 1px solid var(--border); }
        .avatar-box { width: 100px; height: 100px; background: #f1f5f9; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; border: 4px solid var(--border); }
        .avg-val { font-size: 3.5rem; font-weight: 800; color: var(--text); margin: 10px 0; }
        .status-badge { display: inline-block; padding: 8px 20px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; margin-top: 5px; }
        
        .weight-chip { padding: 8px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .weight-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-action { width: 100%; padding: 18px; border-radius: 18px; font-weight: 800; border: none; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-save { background: var(--accent); color: white; box-shadow: 0 10px 20px -5px rgba(132, 204, 22, 0.4); }
        .btn-add { background: var(--input-bg); color: var(--primary); border: 2px dashed var(--border); }
    </style>
</head>
<body>

    <div id="splash" class="screen">
        <div class="logo-icon">🎓</div>
        <h2 style="font-weight: 800; font-size: 1.8rem;">Welcome to Moduley</h2>
        <p style="opacity: 0.8;">Calculate your GPA with speed and precision</p>
        <button class="btn-next" onclick="nextScreen('splash', 'setup')">Get Started</button>
    </div>

    <div id="setup" class="screen hidden">
        <h2 style="font-weight: 800;">Quick Setup</h2>
        <p style="opacity: 0.8; margin-bottom: 30px;">Choose your University Rule</p>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <div class="weight-chip active" id="w1" onclick="setWeight(40, 60, this)">40/60 TD</div>
            <div class="weight-chip" id="w2" onclick="setWeight(50, 50, this)">50/50 TD</div>
        </div>
        <button class="btn-next" onclick="nextScreen('setup', null)">Continue to Calculator</button>
    </div>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background:var(--primary); color:white; width:35px; height:35px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800;">M</div>
            <h1 style="margin:0; font-size: 1.3rem; font-weight: 800;">Moduley.</h1>
        </div>
        <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🌙</button>
    </header>

    <div id="app">
        <div id="capture-area">
            <div class="pro-card">
                <div style="font-size: 0.7rem; font-weight: 800; color: var(--text-sub); margin-bottom: 15px; letter-spacing: 1px;">MODULE LIST</div>
                <div id="module-list"></div>
                <button class="btn-action btn-add" onclick="addModule()">+ Add New Module</button>
            </div>

            <div class="result-panel">
                <div class="avatar-box" id="avatar">👤</div>
                <div id="status-text" style="font-weight: 800; font-size: 1.2rem; color: var(--text-sub);">Ready to calculate</div>
                <div class="avg-val" id="total-avg">0.00</div>
                <div id="status-badge" class="status-badge" style="background: #f1f5f9; color: #64748b;">AWAITING DATA</div>
                <p id="advice-text" style="font-size: 0.8rem; color: var(--text-sub); padding: 0 20px; margin-top: 15px;">Enter your coefficients and grades to see your result.</p>
            </div>
        </div>

        <button class="btn-action btn-save" onclick="takeScreenshot()">📸 Export Result Image</button>
    </div>

    <script>
        let currentTD = 40, currentExam = 60, hasCelebrated = false;

        function nextScreen(curr, next) {
            document.getElementById(curr).classList.add('hidden');
            if(next) document.getElementById(next).classList.remove('hidden');
        }

        function toggleTheme() {
            const b = document.documentElement;
            const isD = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isD ? 'light' : 'dark');
            localStorage.setItem('theme', isD ? 'light' : 'dark');
        }
        if(localStorage.getItem('theme') === 'dark') toggleTheme();

        function setWeight(td, em, el) {
            currentTD = td; currentExam = em;
            document.querySelectorAll('.weight-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active'); calculateAll();
        }

        function validateGrade(el) {
            if (el.value > 20) el.value = 20;
            if (el.value < 0) el.value = 0;
            calculateAll();
        }

        function toggleTD(btn, id) {
            btn.classList.toggle('active');
            btn.innerText = btn.classList.contains('active') ? 'TD: ENABLED' : 'TD: DISABLED';
            const tdInput = document.querySelector(`#${id} .val-td`);
            tdInput.style.opacity = btn.classList.contains('active') ? '1' : '0.3';
            tdInput.disabled = !btn.classList.contains('active');
            if(!btn.classList.contains('active')) tdInput.value = '';
            calculateAll();
        }

        function addModule(savedData = null) {
            const id = 'm' + Math.random().toString(36).substr(2, 9);
            const div = document.createElement('div');
            div.className = 'module-grid';
            div.id = id;
            const isTDActive = savedData ? savedData.hasTD : true;
            
            div.innerHTML = `
                <div>
                    <input type="text" placeholder="Module" class="val-name" value="${savedData?.name || ''}" oninput="calculateAll()">
                    <span class="td-toggle ${isTDActive ? 'active' : ''}" onclick="toggleTD(this, '${id}')">${isTDActive ? 'TD: ENABLED' : 'TD: DISABLED'}</span>
                </div>
                <input type="number" placeholder="Coef" class="val-coef" value="${savedData?.coef || ''}" oninput="calculateAll()">
                <input type="number" placeholder="TD" class="val-td" value="${savedData?.td || ''}" oninput="validateGrade(this)" style="opacity: ${isTDActive ? '1' : '0.3'}" ${isTDActive ? '' : 'disabled'}>
                <input type="number" placeholder="Ex" class="val-exam" value="${savedData?.exam || ''}" oninput="validateGrade(this)">
                <button style="color:var(--fail); background:none; border:none; font-size:1.2rem; cursor:pointer;" onclick="document.getElementById('${id}').remove(); calculateAll();">✕</button>`;
            document.getElementById('module-list').appendChild(div);
            calculateAll();
        }

        function calculateAll() {
            const rows = document.querySelectorAll('.module-grid');
            let tP = 0, tC = 0, saveArr = [];

            rows.forEach(row => {
                const cIn = row.querySelector('.val-coef');
                if(!cIn) return;
                const coef = parseFloat(cIn.value) || 0;
                const tdInput = row.querySelector('.val-td');
                const td = parseFloat(tdInput.value);
                const ex = parseFloat(row.querySelector('.val-exam').value) || 0;
                const isTDActive = row.querySelector('.td-toggle').classList.contains('active');
                
                let final = (!isTDActive || isNaN(td)) ? ex : (td * (currentTD/100)) + (ex * (currentExam/100));
                if (coef > 0) { tP += (final * coef); tC += coef; }
                saveArr.push({ name: row.querySelector('.val-name').value, coef: cIn.value, td: tdInput.value, exam: ex, hasTD: isTDActive });
            });

            const avg = tC > 0 ? (tP / tC).toFixed(2) : "0.00";
            document.getElementById('total-avg').innerText = avg;
            
            const badge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            const advice = document.getElementById('advice-text');
            const avatar = document.getElementById('avatar');
            const numericAvg = parseFloat(avg);
            
            if(numericAvg >= 10) {
                avatar.innerText = "🎓";
                statusText.innerText = "Excellent Result!";
                badge.style.background = "#84cc16"; badge.style.color = "white"; badge.innerText = "PASSED SUCCESS";
                advice.innerText = "You've worked hard and achieved a passing grade. Keep up the momentum!";
                if(!hasCelebrated) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    hasCelebrated = true;
                }
            } else if(numericAvg > 0) {
                avatar.innerText = "📚";
                statusText.innerText = "Keep pushing!";
                badge.style.background = "#ef4444"; badge.style.color = "white"; badge.innerText = "RETAKE REQUIRED";
                advice.innerText = "Don't give up. Identify the weak modules and focus your energy there for the next session.";
                hasCelebrated = false;
            }
            localStorage.setItem('mod_pro_data', JSON.stringify(saveArr));
        }

        function takeScreenshot() {
            html2canvas(document.getElementById('capture-area'), { backgroundColor: null, scale: 3, borderRadius: 32 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Moduley-Pro-Result.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('mod_pro_data') || '[]');
            if(saved.length > 0) {
                saved.forEach(m => addModule(m));
                nextScreen('splash', null); // Skip splash if they have data
            } else {
                addModule();
            }
        };
    </script>
</body>
</html>
